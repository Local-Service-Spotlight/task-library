# Build & deploy Task Library — GitLab CI
#
# Rationale, the change list, and test evidence live in the merge request.
#
# NOTE: pipelines #133-#149 failed with `stuck_or_timeout_failure` and zero-byte
# logs - no runner ever claimed them. Nothing in this file caused that and
# nothing here fixes it; it needs a runner. This file fixes what would break on
# the FIRST green build.
#
# REQUIRED CI/CD VARIABLES (Settings -> CI/CD -> Variables)
#   TRACKER_CSV_URL    [SET]     Asset Tracker "Task Library" tab publish-to-web
#                                CSV link. Mask OFF (GitLab masking rejects URLs).
#   SKILLS_READ_TOKEN  [MISSING] Read token for private spoke repos. Reissue a
#                                fresh one; do not copy the existing value. Mask ON.

stages: [build, verify, deploy]

variables:
  # Floor for the built library. The live GitHub-built artifact is 253.
  # A build that lands under this is missing the tracker feed or a spoke repo,
  # and must not be allowed to publish.
  EXPECTED_MIN_TASKS: "253"
  # Baseline the parity job diffs against. Points at the GitHub-built artifact
  # while GitHub is still the public host.
  PARITY_BASELINE_URL: "https://goodrich-dev.github.io/task-library/data.json"

workflow:
  rules:
    # Merge requests — the review path. New.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Daily schedule (currently PAUSED in the UI — leave it paused until a
    # runner exists; unpausing without a runner just resumes the red noise).
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    # Manual runs from the UI — how you'll trigger the first green build.
    - if: '$CI_PIPELINE_SOURCE == "web"'
    # Pushes to main, EXCEPT when an MR is already open for that branch
    # (prevents duplicate pipelines).
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      when: always
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never

# ---------------------------------------------------------------------------

build:
  stage: build
  image: python:3.12
  timeout: 20m
  interruptible: true
  script:
    # ---- Tracker fetch -----------------------------------------------------
    # Loud outcome either way. Lesson from the 253->240 incident: a silent
    # fetch failure must never masquerade as a healthy build.
    - |
      python3 - <<'PYEOF'
      import os, sys, urllib.request
      url = os.environ.get("TRACKER_CSV_URL", "").strip()
      if not url:
          print("::TRACKER:: TRACKER_CSV_URL not set; building WITHOUT the Asset "
                "Tracker sheet (sheet-onboarded skills and owners will be missing).")
          sys.exit(0)
      try:
          with urllib.request.urlopen(url, timeout=60) as r:
              data = r.read()
          text = data.decode("utf-8-sig", errors="replace")
          lines = [l for l in text.splitlines() if l.strip()]
          rows = max(0, len(lines) - 1)
          if rows < 1 or "," not in lines[0]:
              print(f"::TRACKER:: ERROR: response does not look like CSV "
                    f"(first line: {lines[0][:80]!r}). Failing loudly.")
              sys.exit(1)
          open("tracker.csv", "wb").write(data)
          print(f"::TRACKER:: OK - fetched tracker.csv: {rows} data rows.")
      except Exception as e:
          print(f"::TRACKER:: ERROR: fetch failed: {e}. Failing loudly rather "
                f"than shipping a silently shrunken library.")
          sys.exit(1)
      PYEOF

    # ---- Spoke-token presence check ---------------------------------------
    # build.py resolves sources declared as github:owner/repo@ref:path against
    # raw.githubusercontent.com, adding SKILLS_READ_TOKEN as a bearer header
    # when present. Public spokes work without it; private ones 404 silently.
    # Say out loud which mode we're in so a shrunken build is never a mystery.
    - |
      if [ -n "$SKILLS_READ_TOKEN" ]; then
        echo "::SPOKES:: SKILLS_READ_TOKEN present - private spoke repos will resolve."
      else
        echo "::SPOKES:: WARNING: SKILLS_READ_TOKEN is NOT set. Any private spoke"
        echo "::SPOKES:: repo will fail to fetch. If the task count check below"
        echo "::SPOKES:: trips, this is the first thing to look at."
      fi

    # ---- Build -------------------------------------------------------------
    - if [ -f tracker.csv ]; then python3 build/build.py --tracker-csv tracker.csv; else python3 build/build.py; fi
    - python3 build/build-packs.py

    # ---- Post-build floor check -------------------------------------------
    # Refuse to hand a shrunken data.json downstream. This is the enforcement
    # half of the loud-fail principle: the fetch fails loudly, and so does a
    # build that merely came out small.
    - |
      python3 - <<'PYEOF'
      import json, os, sys
      floor = int(os.environ.get("EXPECTED_MIN_TASKS", "0"))
      with open("dashboard/data.json") as f:
          d = json.load(f)
      stats = d.get("stats", {}) or {}
      total = stats.get("total")
      print(f"::BUILD:: data.json stats: {json.dumps(stats)}")
      print(f"::BUILD:: updated: {d.get('updated')!r}")
      if total is None:
          print("::BUILD:: ERROR: data.json has no stats.total - build output is malformed.")
          sys.exit(1)
      if total < floor:
          print(f"::BUILD:: ERROR: built {total} tasks, expected at least {floor}.")
          print("::BUILD:: Most likely causes, in order:")
          print("::BUILD::   1. SKILLS_READ_TOKEN missing/expired -> private spokes 404")
          print("::BUILD::   2. TRACKER_CSV_URL resolved but returned a partial sheet")
          print("::BUILD::   3. a spoke repo moved or its ref no longer exists")
          sys.exit(1)
      print(f"::BUILD:: OK - {total} tasks (floor {floor}).")
      PYEOF

    - ls -la dashboard/ dashboard/packs/
  artifacts:
    paths: [dashboard]
    expire_in: 1 week

# ---------------------------------------------------------------------------

parity:
  # THE CUTOVER GATE. Diffs this build against the live GitHub-built artifact.
  # While GitHub is still the public host this reports without blocking
  # (allow_failure: true) so a baseline hiccup can't stop publishing.
  # >>> AT CUTOVER: set allow_failure: false. Nothing moves hosts until this
  # >>> job has passed clean at least once.
  stage: verify
  image: python:3.12
  needs: [build]
  interruptible: true
  allow_failure: true
  script:
    - |
      python3 - <<'PYEOF'
      import json, os, sys, urllib.request

      base_url = os.environ["PARITY_BASELINE_URL"]

      with open("dashboard/data.json") as f:
          local = json.load(f)
      try:
          req = urllib.request.Request(base_url, headers={"User-Agent": "task-library-parity"})
          with urllib.request.urlopen(req, timeout=60) as r:
              remote = json.load(r)
      except Exception as e:
          print(f"::PARITY:: ERROR: could not fetch baseline {base_url}: {e}")
          sys.exit(1)

      problems = []

      # data.json shape (verified against the live artifact, Aug 5 2026):
      #   { stats, bundleUrl, metaArticleUrl, updated, categories: [
      #       { folder, name, icon, color, description,
      #         tasks: [ { title, slug, status, stage, article, desc, content } ] } ] }
      # Tasks are NESTED inside categories - there is no top-level task array.
      def flatten(d):
          """-> {"<folder>/<slug>": {status, stage, article}}"""
          out = {}
          for c in d.get("categories") or []:
              folder = c.get("folder") or c.get("name") or "?"
              for t in c.get("tasks") or []:
                  slug = t.get("slug") or t.get("title") or "?"
                  out[f"{folder}/{slug}"] = {
                      "status": t.get("status"),
                      "stage": t.get("stage"),
                      "article": bool(t.get("article")),
                  }
          return out

      # --- stats block, field by field -------------------------------------------
      ls = local.get("stats") or {}
      rs = remote.get("stats") or {}
      for k in sorted(set(ls) | set(rs)):
          if ls.get(k) != rs.get(k):
              problems.append(f"stats.{k}: gitlab={ls.get(k)!r} github={rs.get(k)!r}")
      if not any(p.startswith("stats.") for p in problems):
          print(f"::PARITY:: stats match: {json.dumps(ls, sort_keys=True)}")

      # --- categories -------------------------------------------------------------
      lc = [c.get("folder") for c in (local.get("categories") or [])]
      rc = [c.get("folder") for c in (remote.get("categories") or [])]
      if lc != rc:
          problems.append(
              f"categories differ (order matters):\n"
              f"      only here:   {sorted(set(lc) - set(rc))}\n"
              f"      only prod:   {sorted(set(rc) - set(lc))}")
      else:
          print(f"::PARITY:: categories match ({len(lc)}).")

      # --- task-level diff --------------------------------------------------------
      lt, rt = flatten(local), flatten(remote)
      if not rt:
          problems.append("baseline has zero tasks - wrong URL, or data.json shape changed. "
                          "Refusing to report a pass.")
      elif not lt:
          problems.append("this build produced zero tasks.")
      else:
          missing = sorted(set(rt) - set(lt))
          extra = sorted(set(lt) - set(rt))
          if missing:
              problems.append(
                  f"{len(missing)} task(s) in production but MISSING here "
                  f"(spoke fetch or tracker failure): {missing[:10]}")
          if extra:
              problems.append(
                  f"{len(extra)} task(s) here but not in production "
                  f"(expected only if GitLab is genuinely ahead): {extra[:10]}")

          # status/stage come from the Asset Tracker sheet. A tracker that resolves
          # but returns a PARTIAL feed keeps every task present while silently
          # flipping their status - a shrunken library that passes a count check.
          drift = []
          for k in sorted(set(lt) & set(rt)):
              if lt[k] != rt[k]:
                  drift.append(f"{k}: gitlab={lt[k]} github={rt[k]}")
          if drift:
              problems.append(
                  f"{len(drift)} task(s) match by id but differ in status/stage/article "
                  f"(partial tracker feed?): {drift[:10]}")

          if not missing and not extra and not drift:
              print(f"::PARITY:: task sets identical ({len(lt)} tasks, "
                    f"status/stage/article all match).")

      # --- 'updated' is SUPPOSED to differ ---------------------------------------
      print(f"::PARITY:: updated - gitlab={local.get('updated')!r} "
            f"github={remote.get('updated')!r} (a difference here is expected)")

      if problems:
          print("\n::PARITY:: FAIL - the GitLab build does not match production:")
          for p in problems:
              print(f"::PARITY::   - {p}")
          print("\n::PARITY:: Do NOT cut hosting over until this is clean.")
          sys.exit(1)

      print("\n::PARITY:: PASS - GitLab build matches the live GitHub artifact.")
      PYEOF

# ---------------------------------------------------------------------------

pages:
  # GitLab Pages is NOT ENABLED on this instance as of Aug 5, 2026:
  #   - /-/pages returns 404 on this project
  #   - the Pages API returns 404
  #   - /help/instance_configuration reports the Pages domain as the shipped
  #     placeholder "example.com" on port 80
  # So this job cannot succeed yet, and allow_failure stays TRUE. It is wired
  # correctly so that it works the day Austin turns Pages on.
  #
  # >>> AT CUTOVER, three edits:
  # >>>   1. allow_failure: false
  # >>>   2. add `needs: [build, parity]` so a parity failure blocks the deploy
  # >>>   3. verify the site loads over HTTPS, LOGGED OUT, in a private window.
  # >>>      The group is private and pages_access_level is "private" — if it
  # >>>      prompts for a GitLab login, the blitzmetrics.com iframe will show
  # >>>      a login wall instead of the dashboard. Stop and fix access control.
  stage: deploy
  image: alpine:3.20
  needs: [build]
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE != "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - mkdir -p public && cp -r dashboard/. public/
    - echo "Staged $(find public -type f | wc -l) files for GitLab Pages."
  pages: true
  publish: public
  environment:
    name: production
  artifacts:
    paths: [public]
